name: release

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    name: Build and Publish Release Package
    runs-on: ubuntu-latest

    # id-token lets the job ask GitHub for the OIDC token nuget.org exchanges for a
    # short-lived key. Naming any permission drops the rest to none, so contents has
    # to be restated for checkout.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "9.0"

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build the Project
        run: dotnet build --configuration Release

      - name: Pack NuGet Package
        run: dotnet pack --configuration Release --output ./artifacts

      # The key is valid for an hour and single-use, so it is requested here rather
      # than earlier in the job.
      - name: NuGet Login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        run: |
          dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
