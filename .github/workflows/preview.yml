name: preview

on:
  push:
    branches:
      - preview

jobs:
  build-and-publish:
    name: Build and Publish Preview Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # The next patch above the newest release tag, so a preview always sits one
      # version ahead of what is on nuget.org and sorts before the release itself.
      - name: Generate Preview Version
        run: |
          LATEST=$(git tag -l 'v[0-9]*' | sed 's/^v//' | sort -V | tail -1)
          LATEST=${LATEST:-0.0.0}
          IFS=. read -r MAJOR MINOR PATCH <<< "$LATEST"
          TIMESTAMP=$(date -u +"%y%m%d%H%M%S")
          echo "VERSION=$MAJOR.$MINOR.$((PATCH + 1))-preview.$TIMESTAMP" >> $GITHUB_ENV

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "10.0"

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build the Project
        run: dotnet build --configuration Release /p:Version=${{ env.VERSION }}

      - name: Pack NuGet Package
        run: dotnet pack --configuration Release --output ./artifacts /p:Version=${{ env.VERSION }}

      - name: Publish to NuGet
        run: |
          dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
